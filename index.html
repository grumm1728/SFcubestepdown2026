<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integer Prism Sequence Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --panel: #1b2230;
      --text: #e9eef7;
      --muted: #a4b3cc;
      --accent: #6ea8ff;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .controls {
      background: var(--panel);
      border-bottom: 1px solid #2c3648;
      padding: 0.9rem 1rem;
      display: grid;
      gap: 0.7rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    input[type="number"],
    input[type="range"],
    button {
      font: inherit;
    }

    input[type="number"] {
      width: 6rem;
      background: #111722;
      border: 1px solid #334158;
      color: var(--text);
      border-radius: 0.4rem;
      padding: 0.35rem 0.45rem;
    }

    input[type="range"] {
      flex: 1;
      min-width: 14rem;
    }

    button {
      background: var(--accent);
      color: #0e1524;
      border: none;
      border-radius: 0.45rem;
      padding: 0.45rem 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      font-size: 0.95rem;
      color: var(--muted);
    }

    #scene {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="controls">
    <div class="row">
      <label for="maxN">Max n in sequence:</label>
      <input id="maxN" type="number" min="1" max="150" value="40" />
      <button id="buildBtn">Build sequence</button>
      <span id="status"></span>
    </div>

    <div class="row">
      <label for="stepSlider">Show first k prisms:</label>
      <input id="stepSlider" type="range" min="1" max="1" value="1" disabled />
      <span id="stepLabel" class="mono">k = 1</span>
    </div>

    <div id="details" class="mono">Build a sequence to begin.</div>
  </div>

  <div id="scene"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

    const sceneEl = document.getElementById('scene');
    const maxNInput = document.getElementById('maxN');
    const buildBtn = document.getElementById('buildBtn');
    const statusEl = document.getElementById('status');
    const stepSlider = document.getElementById('stepSlider');
    const stepLabel = document.getElementById('stepLabel');
    const detailsEl = document.getElementById('details');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    sceneEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f141d');

    const camera = new THREE.PerspectiveCamera(55, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 1000);
    camera.position.set(12, 12, 20);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.38));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
    keyLight.position.set(12, 14, 10);
    scene.add(keyLight);

    const axes = new THREE.AxesHelper(8);
    scene.add(axes);
    const grid = new THREE.GridHelper(40, 40, 0x3e4a60, 0x283345);
    grid.position.y = -0.01;
    scene.add(grid);

    const prismGroup = new THREE.Group();
    scene.add(prismGroup);

    const allPrisms = [];

    function divisorsUpToCubeRoot(n) {
      const max = Math.floor(Math.cbrt(n));
      const vals = [];
      for (let a = 1; a <= max; a += 1) {
        if (n % a === 0) vals.push(a);
      }
      return vals;
    }

    function bestDimensions(n) {
      let best = null;
      let bestArea = Infinity;

      for (const a of divisorsUpToCubeRoot(n)) {
        const remAfterA = n / a;
        const maxB = Math.floor(Math.sqrt(remAfterA));
        for (let b = a; b <= maxB; b += 1) {
          if (remAfterA % b !== 0) continue;
          const c = remAfterA / b;
          const area = 2 * (a * b + a * c + b * c);

          if (
            area < bestArea ||
            (area === bestArea && (!best || a < best[0] || (a === best[0] && b < best[1])))
          ) {
            bestArea = area;
            best = [a, b, c];
          }
        }
      }

      return { dims: best, surfaceArea: bestArea };
    }

    function colorForIndex(i, total) {
      const t = total <= 1 ? 0 : i / (total - 1);
      const color = new THREE.Color();
      color.setHSL(0.62 - 0.48 * t, 0.75, 0.56);
      return color;
    }

    function clearPrisms() {
      while (prismGroup.children.length) {
        const child = prismGroup.children.pop();
        child.geometry.dispose();
        child.material.dispose();
      }
      allPrisms.length = 0;
    }

    function rebuild() {
      const maxN = Math.max(1, Math.min(150, Number(maxNInput.value) || 1));
      maxNInput.value = String(maxN);

      clearPrisms();
      statusEl.textContent = 'Computing...';

      const scale = 0.36;
      for (let n = 1; n <= maxN; n += 1) {
        const { dims, surfaceArea } = bestDimensions(n);
        const [a, b, c] = dims;

        const geometry = new THREE.BoxGeometry(a * scale, b * scale, c * scale);
        const material = new THREE.MeshStandardMaterial({
          color: colorForIndex(n - 1, maxN),
          transparent: true,
          opacity: 0.72,
          roughness: 0.33,
          metalness: 0.08
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(a, b, c);
        mesh.visible = false;

        prismGroup.add(mesh);
        allPrisms.push({ n, dims, surfaceArea, mesh });
      }

      stepSlider.disabled = false;
      stepSlider.min = '1';
      stepSlider.max = String(maxN);
      stepSlider.value = String(maxN);
      updateVisible(maxN);
      statusEl.textContent = `Built ${maxN} prisms.`;
    }

    function updateVisible(k) {
      const step = Math.max(1, Math.min(allPrisms.length, k));
      stepLabel.textContent = `k = ${step}`;

      for (let i = 0; i < allPrisms.length; i += 1) {
        allPrisms[i].mesh.visible = i < step;
      }

      const item = allPrisms[step - 1];
      if (item) {
        const [a, b, c] = item.dims;
        detailsEl.textContent = `n=${item.n}  dims=(${a},${b},${c})  volume=${a * b * c}  area=${item.surfaceArea}`;
      }
    }

    buildBtn.addEventListener('click', rebuild);
    stepSlider.addEventListener('input', (ev) => updateVisible(Number(ev.target.value)));

    window.addEventListener('resize', () => {
      const w = sceneEl.clientWidth;
      const h = sceneEl.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }());

    rebuild();
  </script>
</body>
</html>
